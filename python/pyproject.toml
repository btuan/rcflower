[project]
name = "rcflower-python"
version = "0.1.0"
description = "Object detection service for rcflower"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "opencv-python>=4.9",
  "numpy>=1.26",
  "flask>=3.0",
  "ncnn>=1.0.20260526",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ultralytics>=8.4.144",
]
