# A sample YAML file showing detect.py's default configuration -- also a
# template for detect-config.prod.yaml and other device-specific configs,
# which only need to list what they override. Paths are resolved relative
# to the working directory (run from python/, as the README describes).
# See config.py for full descriptions of all keys.

camera:
  # Webcam device index
  source: 0

  # Requested width and height of camera images
  width: 640
  height: 480

model:
  # Path to the NCNN .param export
  path: yolov8n_ncnn_model/model.ncnn.param

  # Path to the model metadata YAML
  labels_path: yolov8n_ncnn_model/metadata.yaml

  # Input size in pixels (square); null uses the model's export size
  input_size: null

  # How to fit the camera frame into input_size: crop, squish, or letterbox
  fit: crop

  # Use Vulkan for GPU inference
  use_vulkan: false

  # NCNN CPU thread count
  cpu_threads: 1

detection:
  # Minimum confidence score for a candidate box to count as a detection
  confidence_threshold: 0.4

  # Intersection-over-union (IoU) threshold for Non-Maximum Suppression (NMS), used to
  # deduplicate detections for the same object
  nms_iou_threshold: 0.45

  # COCO labels to detect; empty list detects all 80 classes
  classes:
    - person

output:
  # Detection state JSON output path
  state_path: ../state/detections.json

  # Snapshot JPEG path for debugging; empty disables it (off by default for privacy)
  snapshot_path: ""

  # Minimum seconds between snapshot writes
  snapshot_interval: 1.0

  # POST target; "" disables it
  backend_url: http://127.0.0.1:3000/api/detections

# No GUI window (Ctrl+C to quit); false opens one (press q to quit)
headless: true
