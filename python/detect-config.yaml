# A sample YAML file showing detect.py's default configuration -- also a
# template for detect-config.prod.yaml and other device-specific configs,
# which only need to list what they override. Paths are resolved relative
# to the working directory (run from python/, as the README describes).
# See config.py for full descriptions of all keys.

camera:
  source: 0 # Webcam device index
  width: 640 # Capture width
  height: 480 # Capture height

model:
  path: yolov8n_ncnn_model/model.ncnn.param # Path to the NCNN .param export
  labels_path: yolov8n_ncnn_model/metadata.yaml # Path to the model metadata YAML

  # Input size in pixels (square); null uses the model's export size
  input_size: null

  # How to fit the camera frame into input_size: crop, squish, or letterbox
  fit: crop

  # Use Vulkan for GPU inference
  use_vulkan: false

  # NCNN CPU thread count
  cpu_threads: 1

detection:
  confidence_threshold: 0.4 # Confidence threshold
  nms_iou_threshold: 0.45 # NMS IoU threshold

  # COCO labels to detect; empty list detects all 80 classes
  classes:
    - person

output:
  state_path: ../state/detections.json # Detection state JSON output path

  # Snapshot JPEG path for debugging; empty disables it (off by default for privacy)
  snapshot_path: ""
  snapshot_interval: 1.0 # Minimum seconds between snapshot writes

  backend_url: http://127.0.0.1:3000/api/detections # POST target; "" disables it

# No GUI window (Ctrl+C to quit); false opens one (press q to quit)
headless: true
